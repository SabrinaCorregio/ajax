<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Github</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <header>
        <div class="container">
            <img id="avatar" class="profile-avatar" src="https://placehold.co/180x180" alt=".">
            <h1 id="name" class="profile-name"></h1>
            <h2 id="username" class="profile-username"></h2>
            <ul class="numbers">
                <li class="numbers-item">
                    <h4>Repositórios</h4>
                    <span id="repo"></span>
                </li>
                <li class="numbers-item">
                    <h4>Seguidores</h4>
                    <span id="seguem"></span>   
                </li>
                <li class="numbers-item">
                    <h4>Seguindo</h4>
                    <span id="seguin"></span>
                </li>
            </ul>
            <a id="perfil" href="" class="profile-link">Ver no Github</a>
        </div>
    </header>
</body>
<script src="main.js"></script>
</html>
